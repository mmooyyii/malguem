name: Build TV Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode keystore
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "${RUNNER_TEMP}/release.jks"

      - name: Build release APK
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          # 应用内 OTA 更新依赖: versionName=tag 名, versionCode 单调递增
          VERSION_NAME: ${{ github.ref_name }}
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew :app:assembleRelease

      - name: Prepare release assets
        # 固定文件名: 应用内更新走 releases/latest/download/<固定名>, 不依赖 GitHub API, 可套 ghproxy
        run: |
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk release/malguem-tv.apk
          echo "{\"tag\":\"${GITHUB_REF_NAME}\"}" > release/version.json

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: malguem-tv-${{ github.ref_name }}
          path: release/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true

      # ---- 大陆更新源: 同一份资产同时发到 GitHub Pages 与 release 分支(jsDelivr 回源), 电视端多源依次试 ----

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: release

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Publish to release branch
        # app 内置 jsDelivr 多域名源回源这个分支拉更新.
        # 孤儿单提交强推, 分支永远只有最新一版, 仓库不膨胀
        run: |
          cd release
          git init -b release
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "release ${GITHUB_REF_NAME}"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" release:release

      - name: Purge jsDelivr cache
        # @branch 的 URL 有边缘缓存, 主动 purge 让新版本尽快可见 (失败不影响发版)
        run: |
          curl -s -m 30 "https://purge.jsdelivr.net/gh/${{ github.repository }}@release/version.json" || true
          curl -s -m 30 "https://purge.jsdelivr.net/gh/${{ github.repository }}@release/malguem-tv.apk" || true
